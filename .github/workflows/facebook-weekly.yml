name: Weekly Facebook activity report
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: facebook-weekly-report
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || vars.FB_WEEKLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read weekly aggregate using the verified private report package
        run: |
          node --input-type=module <<'JS'
          import {downloadBundle} from './bootstrap.mjs';
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'d78f979b08be87bf294668cfac5fbd831fdcd7d49a71d0ed3e3bebb442763291'},{output:'fb-weekly.mjs'});
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'4a4fef1d0b329b0eba62b9c5d92cf9140361b12d9205e7e1089059e6b0357e8a'},{output:'fb-weekly-plot.py'});
          JS
          node fb-weekly.mjs prepare
      - name: Render the Taipei publication-hour chart
        run: |
          python -m pip install matplotlib==3.10.7 > "$RUNNER_TEMP/matplotlib-install.log" 2>&1
          python fb-weekly-plot.py fb-weekly-report.json fb-weekly.png
      - name: Publish the weekly report once
        if: github.event_name == 'schedule' || inputs.mode == 'publish'
        run: node fb-weekly.mjs send
        env:
          FB_WEEKLY_CHANNEL: '1574303886934540368'
          DISCORD_WEBHOOK_URL_FB_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_URL_FB_WEEKLY }}
