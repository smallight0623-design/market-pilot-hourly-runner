name: Weekly Facebook activity report
on:
  schedule:
    - cron: '0 1 * * 1'
    - cron: '20 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish, refresh]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: facebook-weekly-report
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || vars.FB_WEEKLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read weekly aggregate using the verified private report package
        run: |
          node --input-type=module <<'JS'
          import {downloadBundle} from './bootstrap.mjs';
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'408ef68c872e872533dd80bbf8d743002736681e4648ed7cae4ac23d086b1508'},{output:'fb-weekly.mjs'});
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'ef43bdf4fcf7b2f7259fc42e0a7327f371b8071c12a1ceab9837f5eec8d2e6a0'},{output:'fb-weekly-plot.py'});
          JS
          node fb-weekly.mjs prepare
      - name: Render the Taipei publication-hour chart
        run: |
          python -m pip install matplotlib==3.10.7 > "$RUNNER_TEMP/matplotlib-install.log" 2>&1
          python fb-weekly-plot.py fb-weekly-report.json fb-weekly.png
      - name: Publish the weekly report once
        if: github.event.schedule == '0 1 * * 1' || inputs.mode == 'publish' || inputs.mode == 'refresh'
        run: node fb-weekly.mjs "${{ inputs.mode == 'refresh' && 'refresh' || 'send' }}"
        env:
          FB_WEEKLY_CHANNEL: '1574303886934540368'
          DISCORD_WEBHOOK_URL_FB_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_URL_FB_WEEKLY }}
