name: Pattern authority isolated validation
run-name: Pattern authority Linux c9c18b5e
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked download dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Read exact private candidate only
        run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: c9c18b5e2d179ccced8707b16f0f03f1144dd177bc7d708b4eb60d4088f58dba
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Validate and extract private archive
        run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert len(z.infolist()) == 262
              assert sum(x.file_size for x in z.infolist()) <= 64*1024*1024
              for x in z.infolist():
                  p=pathlib.PurePosixPath(x.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in x.filename and ':' not in x.filename
                  assert p.name != '.env' and (x.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('app')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash locked offline engine and JS dependencies
        run: |
          python -m pip install --require-hashes -r app/visual-pattern/requirements-linux.txt > "$RUNNER_TEMP/python-install.log" 2>&1
          npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/storage-install.log" 2>&1
          npm ci --prefix app/cloud-trial --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Verify offline pattern engine and existing 142 references
        working-directory: app
        run: |
          node visual-pattern/smoke.mjs > "$RUNNER_TEMP/smoke.log" 2>&1
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';import {descriptorBuilder} from './catalog/runtime.mjs';
          const library=JSON.parse(await fs.readFile('I015-統一資源庫/資源庫匯出.json','utf8')),bank=JSON.parse(await fs.readFile('visual-pattern/engine/reference-bank.json','utf8'));
          const assets=library.entries.filter(e=>e.enabled&&e.type==='skin').map(e=>({...e,references:bank.entries.filter(r=>r.libraryId===e.id).map(r=>({url:'images/'+r.visualId+'.webp'}))}));
          assert.equal(assets.length,142);const fingerprint=createHash('sha256').update(JSON.stringify(assets.map(({id,name,references})=>({id,name,references})))).digest('hex');
          const built=await descriptorBuilder({get:async()=>{throw Error('network_not_allowed');}})(assets,fingerprint);
          assert.equal(built.metadata.referenceCount,142);assert.equal(built.metadata.sourceReferenceSha256,fingerprint);assert.equal(createHash('sha256').update(built.npz).digest('hex'),built.metadata.bankSha256);
          console.log(JSON.stringify({status:'passed',existingReferences:142,newImageBuilds:0,networkCalls:0,modelCalls:0}));
          JS
      - name: Python grid unit tests
        working-directory: app/visual-pattern/engine
        run: python -m unittest test_matcher > "$RUNNER_TEMP/python-tests.log" 2>&1
      - name: Test packaged runner with no business credentials
        working-directory: app
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const r=spawnSync(process.execPath,['--test'],{encoding:'utf8',maxBuffer:16*1024*1024,env:{PATH:process.env.PATH,HOME:process.env.HOME}});
          const pass=r.stdout?.match(/^# pass (\d+)/m)?.[1],fail=r.stdout?.match(/^# fail (\d+)/m)?.[1];
          console.log(JSON.stringify({event:'packaged_runner_tests',pass:Number(pass??0),fail:Number(fail??0),exit:r.status}));
          if(r.status!==0)process.exit(1);
          JS
