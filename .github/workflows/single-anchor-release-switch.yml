name: Currency release switch
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/bootstrap.log" 2>&1
      - name: Read exact approved private release
        run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: 225b3cc06edeff4b897ff1400d6e4f92d1afacac4c813151bcbb2e2ef714bc3a
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Extract verified application
        run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert len(z.infolist()) == 307
              assert sum(x.file_size for x in z.infolist()) < 64*1024*1024
              for x in z.infolist():
                  p=pathlib.PurePosixPath(x.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in x.filename and ':' not in x.filename
                  assert p.name != '.env' and (x.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('app')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps --require-hashes -r app/visual-pattern/requirements-linux.txt > "$RUNNER_TEMP/visual-install.log" 2>&1
      - run: npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/storage.log" 2>&1
      - name: Apply release with native S3 conditional writes
        working-directory: app
        run: node ops/single-anchor-release.mjs --apply-currency-release
        env:
          CURRENCY_TARGET_RELEASE: 225b3cc06edeff4b897ff1400d6e4f92d1afacac4c813151bcbb2e2ef714bc3a
          APPROVED_NOTE_SHA: f5984740548db899799e5ae201cf34476d7f482390c3d7261657c8f874e3e0ba
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}

      - name: Correct the approved original card from saved images only
        working-directory: app
        run: node ops/single-anchor-refresh.mjs --refresh-approved-card
        env:
          CURRENCY_TARGET_RELEASE: 225b3cc06edeff4b897ff1400d6e4f92d1afacac4c813151bcbb2e2ef714bc3a
          DISCORD_ROUTING_KEY: ${{ secrets.DISCORD_ROUTING_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
