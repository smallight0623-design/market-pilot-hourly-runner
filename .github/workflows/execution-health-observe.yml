name: Observe an existing hourly execution
on:
  workflow_run:
    workflows: [Hourly market monitor]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  execution_health:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test execution-health.test.mjs
      - name: Observe saved execution without starting business work
        run: node execution-health-reporter.mjs
        env:
          HEALTH_TARGET_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
