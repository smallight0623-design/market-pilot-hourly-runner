name: Hourly account model CP TOP10
on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: publish
        required: false
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, publish]
        default: preview
        required: true
permissions:
  contents: read
concurrency:
  group: market-pilot-daily-cp
  cancel-in-progress: false
jobs:
  ranking:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_CP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/cp-bootstrap.log" 2>&1
      - run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: 471821cf7413b558d195c3ae5678c7bb81bbcac7056f19bbb7e66087c972d627
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Verify immutable report application
        run: |
          python - <<'PY'
          import zipfile,pathlib,json,hashlib
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert sum(i.file_size for i in z.infolist()) < 192*1024*1024
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and ':' not in i.filename and chr(92) not in i.filename
                  assert p.name!='.env' and 'node_modules' not in p.parts
                  assert (i.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('app')
          root=pathlib.Path('app');m=json.loads((root/'recognition-release-manifest.json').read_bytes())
          for name,sha in m['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          PY
          npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/cp-storage.log" 2>&1
      - name: Check ranking and single-delivery protections
        run: node --test app/daily-cp/daily-cp.test.mjs
      - name: Build or publish last 24 hours model CP ranking
        run: node app/daily-cp/main.mjs
        env:
          DAILY_CP_MODE: ${{ inputs.mode || 'publish' }}
          DAILY_CP_ENABLED: 'true'
          DAILY_CP_CADENCE: hourly
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL_DAILY_CP: ${{ secrets.DISCORD_WEBHOOK_URL_DAILY_CP }}
