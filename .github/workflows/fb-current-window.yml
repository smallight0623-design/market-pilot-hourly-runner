name: Facebook capacity current-window acceptance
run-name: '${{ inputs.execution_mode }} / ${{ inputs.scheduled_for }} / ${{ inputs.dispatch_id }}'
on:
  workflow_dispatch:
    inputs:
      execution_mode:
        type: choice
        options: [hourly]
        required: true
      scheduled_for:
        type: string
        required: true
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  facebook:
    concurrency:
      group: market-pilot-facebook-publisher
      cancel-in-progress: false
    name: Facebook independent collection and publishing
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked bootstrap dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/bootstrap-install.log" 2>&1
      - name: Read and verify approved private application
        run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: ${{ vars.APPROVED_PACKAGE_SHA }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Extract verified application safely
        run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert sum(x.file_size for x in z.infolist()) <= 192*1024*1024
              for x in z.infolist():
                  p=pathlib.PurePosixPath(x.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in x.filename and ':' not in x.filename
                  assert p.name != '.env' and (x.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('app')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/recognition/requirements-linux.txt
      - name: Install accepted CPU recognition runtime
        run: |
          python -m pip install 'torch==2.15.0+cpu' 'torchvision==0.29.2+cpu' --index-url https://download.pytorch.org/whl/cpu > "$RUNNER_TEMP/torch-install.log" 2>&1
          python -m pip install -r app/recognition/requirements-linux.txt > "$RUNNER_TEMP/pattern-install.log" 2>&1
      - name: Verify local pattern bridge without AI or Discord
        working-directory: app
        run: |
          if ! node visual-pattern/smoke.mjs > "$RUNNER_TEMP/pattern-smoke.log" 2>&1; then
            echo 'Local pattern matcher verification failed before business work.'
            exit 1
          fi
      - name: Verify local currency bridge without AI or Discord
        working-directory: app
        run: node currency-pattern/smoke.mjs > "$RUNNER_TEMP/currency-smoke.log" 2>&1
      - name: Install Facebook storage dependencies only
        run: npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/facebook-install.log" 2>&1
      - name: Verify Facebook rules
        working-directory: app
        run: |
          if ! node --test facebook/*.test.mjs > "$RUNNER_TEMP/facebook-checks.log" 2>&1; then
            echo 'Facebook checks failed before business operations.'
            exit 1
          fi
      - name: Verify accepted recognition bridge
        working-directory: app
        run: node recognition/check_bridge.mjs > "$RUNNER_TEMP/adopted-smoke.log" 2>&1
        env:
          YOLO_AUTOINSTALL: 'false'
          OMP_NUM_THREADS: '2'
      - name: Facebook collection and pending continuation
        working-directory: app
        run: node facebook/cloud-entry.mjs
        env:
          ADOPTED_RECOGNITION: v1
          YOLO_AUTOINSTALL: 'false'
          OMP_NUM_THREADS: '2'
          LOCAL_CURRENCY_AUTHORITY: v1
          APPROVED_PACKAGE_SHA: ${{ vars.APPROVED_PACKAGE_SHA }}
          FB_OBSERVATION_TRIAL: ${{ vars.FB_OBSERVATION_TRIAL }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
          RELAYROUTER_API_KEY: ${{ secrets.RELAYROUTER_API_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          DISCORD_ROUTING_KEY: ${{ secrets.DISCORD_ROUTING_KEY }}
          DISCORD_APPLICATION_ID: '1563256161707364382'
