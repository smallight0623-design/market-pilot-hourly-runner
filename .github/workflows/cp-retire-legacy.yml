name: Retire verified legacy CP board
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-pilot-daily-cp
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node cp-retire-legacy.mjs
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL_DAILY_CP: ${{ secrets.DISCORD_WEBHOOK_URL_DAILY_CP }}
