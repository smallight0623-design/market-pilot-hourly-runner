name: Approved maintenance checkpoint
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [pause, resume]
        required: true
      expected_hash:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: market-pilot-explicit-release
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node maintenance-checkpoint.mjs
        env:
          OPERATION: ${{ inputs.operation }}
          EXPECTED_HASH: ${{ inputs.expected_hash }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
