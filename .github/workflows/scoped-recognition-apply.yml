name: Apply approved scoped recognition release
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.40.69
      - name: Read exact validated release
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
        shell: python
        run: |
          import boto3,os,hashlib,zipfile,io,pathlib
          sha='2514fc10e815c677edbfc431e2cb84b930e12ce35275fbf57b346dccff226a59'
          client=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          data=client.get_object(Bucket='market-pilot-state-trial',Key='i015-trial/hourly-live-v1/blobs/'+sha+'.blob')['Body'].read()
          assert len(data)<40*1024*1024 and hashlib.sha256(data).hexdigest()==sha
          pathlib.Path('hourly-package.zip').write_bytes(data)
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
            assert len(archive.infolist())==310
            for name in archive.namelist():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name and ':' not in name
            archive.extractall('app')
      - run: npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund
      - name: Conditional inventory and configuration switch
        working-directory: app
        run: node ops/scoped-release.mjs --apply-scoped-release
        env:
          SCOPED_TARGET_RELEASE: 2514fc10e815c677edbfc431e2cb84b930e12ce35275fbf57b346dccff226a59
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
