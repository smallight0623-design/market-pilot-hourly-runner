name: Official demo browser control check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/install.log" 2>&1
      - name: Read exact existing formal application
        run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: '67d1145a6fe071b08421209070f59c1b5b381996ac47d4340ff05fdb81cf22bd'
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Verify private package and install locked browser client
        run: |
          python - <<'PY'
          import zipfile,pathlib,hashlib,json
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert sum(x.file_size for x in z.infolist()) <= 192*1024*1024
              for name in z.namelist():
                  p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and ':' not in name and chr(92) not in name
              z.extractall('app')
          root=pathlib.Path('app');manifest=json.loads((root/'recognition-release-manifest.json').read_bytes())
          for name,sha in manifest['files'].items():assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          PY
          npm ci --prefix app/cloud-trial --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Test official demo with formal browser settings and no business credentials
        run: node browser-control-check.mjs
      - name: Preserve public-demo results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-demo-control-result
          retention-days: 1
          path: |
            browser-control-check.json
            browser-control-check.png
