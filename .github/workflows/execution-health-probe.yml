name: Isolated execution health failure probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Verify application rules
        run: exit 1
  execution_health:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test execution-health.test.mjs
      - name: Observe the isolated failed job
        run: node execution-health-reporter.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
