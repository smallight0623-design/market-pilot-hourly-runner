name: 8591 completed account observations
on:
  schedule:
    - cron: '40 15 * * *'
    - cron: '15 1 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [scan-preview, capture, preview, preview-publish, publish, verify-delivery]
        default: scan-preview
        required: true
permissions:
  contents: read
concurrency:
  group: market-completed-observations
  cancel-in-progress: false
jobs:
  market:
    if: github.event_name == 'workflow_dispatch' || vars.MARKET_WEEKLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      DISCORD_WEBHOOK_URL_8591_WEEKLY: ${{ secrets.DISCORD_WEBHOOK_URL_8591_WEEKLY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load verified private analytics package
        run: |
          node --input-type=module <<'JS'
          import {downloadBundle} from './bootstrap.mjs';
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'7fdf7eee6104593d7de633b1ab93caa7621445d9f1848a17d702d93a39c22704'},{output:'market-weekly.mjs'});
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'81407331a988a5bb151c03eed21b4df91617087dc8297071fd2432531a994e35'},{output:'market-plot.py'});
          JS
      - name: Load verified resource reference images
        if: inputs.mode == 'preview' || inputs.mode == 'preview-publish' || inputs.mode == 'publish' || github.event.schedule == '15 1 * * 1'
        run: |
          node --input-type=module <<'JS'
          import {downloadBundle} from './bootstrap.mjs';
          await downloadBundle({...process.env,APPROVED_PACKAGE_SHA:'07e788f1b6594b18fee0ead23c2532dfe868fbfe150b9267907a4118908f2c02'},{output:'market-reference-images.json.gz'});
          JS
      - name: Read completed public catalogue
        if: inputs.mode == 'scan-preview' || inputs.mode == 'capture' || github.event.schedule == '40 15 * * *'
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          node market-weekly.mjs "${{ inputs.mode || 'capture' }}"
      - name: Prepare previous Taipei week
        if: inputs.mode == 'preview' || inputs.mode == 'preview-publish' || inputs.mode == 'publish' || github.event.schedule == '15 1 * * 1'
        run: |
          node market-weekly.mjs "${{ inputs.mode == 'preview-publish' && 'prepare-preview' || 'prepare' }}"
          python -m pip install matplotlib==3.10.7 > "$RUNNER_TEMP/plot-install.log" 2>&1
          python - <<'PY'
          import json,subprocess
          with open('market-weekly-report.json') as f:
              report=json.load(f)
          if report['market']['observationDays']:
              subprocess.run(['python','market-plot.py','market-weekly-report.json','market-weekly.png','--market','firstSeen'],check=True)
          PY
      - name: Publish weekly observation report
        if: inputs.mode == 'publish' || inputs.mode == 'preview-publish' || github.event.schedule == '15 1 * * 1'
        run: node market-weekly.mjs "${{ inputs.mode == 'preview-publish' && 'send-preview' || 'send' }}"
      - name: Save aggregate preview for review
        if: inputs.mode == 'preview-publish'
        uses: actions/upload-artifact@v4
        with:
          name: completed-market-preview
          path: |
            market-weekly-report.json
            market-weekly.png
          retention-days: 7
      - name: Verify destination
        if: inputs.mode == 'verify-delivery'
        run: node market-weekly.mjs verify-delivery
