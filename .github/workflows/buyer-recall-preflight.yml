name: Currency isolated Linux validation
run-name: Currency wired Linux 3dfdf982
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/npm.log" 2>&1
      - name: Read exact private validation bundle
        run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: c3d13c5c98799257de9b60911180d467272c0f0e2fb1c4225145a955c9387ac3
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Validate private archive paths
        run: |
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert len(z.infolist()) == 327
              assert sum(x.file_size for x in z.infolist()) < 80*1024*1024
              for x in z.infolist():
                  p=pathlib.PurePosixPath(x.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in x.filename and ':' not in x.filename
                  assert p.name != '.env' and (x.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall('app')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-locked CPU engines
        run: |
          python -m pip install --no-deps --require-hashes -r app/visual-pattern/requirements-linux.txt -r app/currency-pattern/requirements-linux.txt > "$RUNNER_TEMP/ocr-install.log" 2>&1
          npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/state-install.log" 2>&1
          npm ci --prefix app/cloud-trial --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/browser-install.log" 2>&1
      - name: Verify currency bridge without business credentials
        working-directory: app
        run: node currency-pattern/smoke.mjs
      - name: Unit tests without business credentials
        working-directory: app
        run: |
          python -m unittest discover -s currency-pattern > "$RUNNER_TEMP/currency-tests.log" 2>&1
          python -m unittest discover -s visual-pattern/engine > "$RUNNER_TEMP/grid-tests.log" 2>&1
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const r=spawnSync(process.execPath,['--test'],{encoding:'utf8',maxBuffer:16*1024*1024,env:{PATH:process.env.PATH,HOME:process.env.HOME}});
          const pass=r.stdout?.match(/^# pass (\d+)/m)?.[1],fail=r.stdout?.match(/^# fail (\d+)/m)?.[1];
          console.log(JSON.stringify({event:'private_package_tests',pass:Number(pass??0),fail:Number(fail??0),exit:r.status}));
          if(r.status!==0)process.exit(1);
          JS
      - name: Real image scan and OCR through production-style wrapper
        working-directory: app
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {runCurrencyMatch} from './currency-pattern/runtime.mjs';
          const old=JSON.parse(await fs.readFile('.fixtures/regression-expected.json','utf8'));
          const paths=['.fixtures/reference.png','.fixtures/echo.image',...old.images.map(r=>'.fixtures/'+r.sampleId+'.image')];
          const images=await Promise.all(paths.map(async path=>({bytes:await fs.readFile(path)})));
          const r=await runCurrencyMatch(images,{maxSeconds:180});
          if(!r.coverageComplete||!r.ocrCoverageComplete||r.images.length!==11)throw Error('currency_image_coverage');
          const expected=[{金幣:1000000,寶石:8479,點券:99},{金幣:28643,點券:42}];
          for(let i=0;i<2;i++)for(const [name,value]of Object.entries(expected[i]))if(!r.images[i].matches.some(m=>m.name===name&&m.quantity?.value===value))throw Error('currency_positive_fixture_failed');
          for(let i=0;i<old.images.length;i++){
            const a=[...new Set(r.images[i+2].matches.map(m=>m.name))].sort(),b=[...new Set(old.images[i].matches.map(m=>m.name))].sort();
            if(b.some(n=>!a.includes(n)))throw Error('currency_regression_name_removed');console.log(JSON.stringify({event:'regression_names',sample:old.images[i].sampleId,added:a.filter(n=>!b.includes(n))}));
          }
          const user=await runCurrencyMatch(await Promise.all(Array.from({length:7},(_,i)=>fs.readFile('.fixtures/resource-'+(i+1)+'.png').then(bytes=>({bytes})))),{maxSeconds:180});
          const expectedNames=[['金幣','寶石','點券'],['造型通用碎片','英雄通用碎片'],['傳說水晶'],['改名卡'],['魔法水晶'],['空間魔晶'],['奧義碎片']];
          for(let i=0;i<7;i++)if(JSON.stringify(user.images[i].matches.map(m=>m.name).sort())!==JSON.stringify(expectedNames[i].sort()))throw Error('manual_resource_name_mismatch');
          if(!user.images[6].matches.some(m=>m.name==='奧義碎片'&&m.quantity?.value===110000&&m.quantity.exact===false))throw Error('arcana_unit_mismatch');
          console.log(JSON.stringify({event:'manual_resource_fixture',status:'passed',images:7,names:10,seconds:user.seconds}));
          console.log(JSON.stringify({event:'linux_currency_fixture',status:'passed',images:r.images.length,positiveQuantities:5,regressionImages:9,seconds:r.seconds,networkCalls:r.networkCalls}));
          JS

      - name: Replay exact buyer misses without AI or Discord
        working-directory: app
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import assert from 'node:assert/strict';
          import {prepareBuyerRecovery} from './facebook/buyer-recovery.mjs';import {prepareEntry,cardParts} from './facebook/feed.mjs';
          const rows=JSON.parse(await fs.readFile('.fixtures/buyer-regression.json')),library=JSON.parse(await fs.readFile('.fixtures/library.json')).library;
          for(const row of rows){const provider={choices:[{message:{content:JSON.stringify(row.analysis)}}]};const e=prepareBuyerRecovery(row.post,provider,library);assert.equal(e.direction,'buy');assert.equal(e.status,'candidate');assert.equal(cardParts(e)[0].imageReferences.length,row.post.images.slice(0,4).length);}
          const post=JSON.parse(await fs.readFile('.fixtures/buyer-manual-post.json')),entry=prepareBuyerRecovery(post,null,library,{manualLiteral:true});assert.equal(entry.direction,'buy');assert.equal(entry.summary.game,'遊戲未明示');assert(entry.summary.price.includes('100萬元'));assert(cardParts(entry)[0].embeds[0].description.includes('人工按原文'));
          console.log(JSON.stringify({event:'buyer_replay_fixture',status:'passed',savedReplies:rows.length,manualLiteral:1,modelCalls:0,discordWrites:0}));
          JS
