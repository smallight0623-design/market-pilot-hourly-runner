name: Browser dependency diagnosis
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bundle, system_chrome]
        default: bundle
        required: true
      runner:
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: ${{ vars.APPROVED_PACKAGE_SHA }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - run: python -c "import zipfile; zipfile.ZipFile('hourly-package.zip').extractall('app')"
      - name: Diagnose public browser dependencies
        run: |
          npm ci --prefix app/cloud-state --no-audit --no-fund
          npm ci --prefix app/cloud-trial --no-audit --no-fund
          cd app/cloud-trial
          if [ "${{ inputs.mode }}" = system_chrome ]; then
            node --input-type=module -e "import {chromium} from 'playwright';const b=await chromium.launch({channel:'chrome',headless:true});const p=await b.newPage();await p.setContent('<title>browser-ready</title>');if(await p.title()!=='browser-ready')throw Error('browser_smoke');console.log('SYSTEM_CHROME_BROWSER_SMOKE_PASSED');await b.close();"
          else
            npx playwright install --with-deps chromium
          fi
