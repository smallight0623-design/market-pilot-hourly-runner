name: Read-only live recognition acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.40.69
      - name: Read private immutable packages
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
        shell: python
        run: |
          import boto3,os,hashlib,zipfile,io,pathlib
          client=boto3.client('s3',endpoint_url=os.environ['R2_ENDPOINT'],aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          for sha in ['2514fc10e815c677edbfc431e2cb84b930e12ce35275fbf57b346dccff226a59','0910c71ac930334dfc0f83c8b4baaf9a7de5f648c362ceceed6e776bfd66f2b6']:
            data=client.get_object(Bucket='market-pilot-state-trial',Key='i015-trial/hourly-live-v1/blobs/'+sha+'.blob')['Body'].read()
            assert len(data)<40*1024*1024 and hashlib.sha256(data).hexdigest()==sha
            with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for name in archive.namelist():
                p=pathlib.PurePosixPath(name)
                assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name and ':' not in name
              archive.extractall('app')
      - run: |
          python -m pip install --no-deps --require-hashes -r app/visual-pattern/requirements-linux.txt
          npm ci --prefix app/cloud-state --ignore-scripts --no-audit --no-fund
      - name: Load live configuration and run formal recognition API
        working-directory: app
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {R2Transport} from './cloud-state/r2-transport.mjs';
          import {readVersion} from './configuration/versions.mjs';
          import {installCatalogBank} from './catalog/runtime.mjs';
          import {runPatternMatch} from './visual-pattern/runtime.mjs';
          const env=process.env;
          const t=new R2Transport({endpoint:env.R2_ENDPOINT,bucket:'market-pilot-state-trial',prefix:'i015-trial/hourly-live-v1',accessKeyId:env.R2_ACCESS_KEY_ID,secretAccessKey:env.R2_SECRET_ACCESS_KEY},{maxRequests:8,maxUploadBytes:1});
          try {
            const current=await readVersion({get:(k,m)=>t.getConfig(k,m)},{expectedReleaseHash:'2514fc10e815c677edbfc431e2cb84b930e12ce35275fbf57b346dccff226a59'});
            const library=current.version.documents.library;
            const install=await installCatalogBank(library,{get:(k,m)=>t.getCatalog(k,m)});
            const report=await runPatternMatch([{bytes:fs.readFileSync('.fixtures/full-frame.image')}],library);
            const names=report.images.flatMap(image=>image.matches.map(m=>m.name));
            const expected=JSON.parse(fs.readFileSync('.fixtures/expected.json','utf8'));
            if(JSON.stringify(names)!==JSON.stringify(expected)||report.images[0].cellsChecked!==12)throw Error('live_acceptance_mismatch');
            console.log(JSON.stringify({event:'live_formal_api_acceptance',status:'passed',configRevision:current.version.revision,referenceCount:report.referenceCount,install:install.status,matches:names.length,seconds:report.seconds,cloudWrites:0}));
          }finally{t.close()}
          JS
