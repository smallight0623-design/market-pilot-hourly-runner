name: Isolated pattern validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/bootstrap-install.log" 2>&1
      - name: Prepare bounded candidate-only bootstrap copy
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('bootstrap.mjs').read_text()
          assert s.count('2*1024*1024')==2
          Path('.pattern-bootstrap.mjs').write_text(s.replace('2*1024*1024','8*1024*1024'))
          PY
      - name: Read only the fixed candidate package
        run: node .pattern-bootstrap.mjs
        env:
          APPROVED_PACKAGE_SHA: '10f2d2623a7c93068f1a87fdc342e8fcd994a2c22f012c7a385384ae4526319c'
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TRIAL_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TRIAL_SECRET_ACCESS_KEY }}
      - name: Extract verified candidate with bounded paths
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import zipfile
          with zipfile.ZipFile('hourly-package.zip') as z:
              assert sum(x.file_size for x in z.infolist()) <= 64*1024*1024
              for x in z.infolist():
                  p=PurePosixPath(x.filename)
                  assert not p.is_absolute() and '..' not in p.parts and chr(92) not in x.filename and ':' not in x.filename
                  assert p.name != '.env' and (x.external_attr >> 16)&0o170000 != 0o120000
              z.extractall('app')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only hash-locked image dependencies
        run: python -m pip install --require-hashes -r app/visual-pattern/requirements-linux.txt > "$RUNNER_TEMP/pattern-install.log" 2>&1
      - name: Validate actual matcher and bridge without cloud writes
        working-directory: app
        run: |
          if ! python visual-pattern/engine/test_matcher.py > "$RUNNER_TEMP/python-checks.log" 2>&1; then
            echo 'Pattern engine checks failed; no business work was started.'
            exit 1
          fi
          if ! node --test visual-pattern/pattern.test.mjs > "$RUNNER_TEMP/node-checks.log" 2>&1; then
            echo 'Pattern evidence checks failed; no business work was started.'
            exit 1
          fi
          if ! node visual-pattern/smoke.mjs > "$RUNNER_TEMP/smoke-check.log" 2>&1; then
            echo 'Pattern integration failed; no business work was started.'
            exit 1
          fi
          cat "$RUNNER_TEMP/smoke-check.log"
